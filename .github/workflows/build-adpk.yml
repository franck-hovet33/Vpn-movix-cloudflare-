name: Build Movix APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Trouver et décompresser le projet
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun fichier ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"
          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Trouver le dossier Android
        run: |
          echo "Contenu du projet :"
          find project -maxdepth 3 -type f | head -100

          DIR=$(find project -name "settings.gradle" -type f | head -n 1 | xargs dirname)

          if [ -z "$DIR" ]; then
            echo "ERREUR : settings.gradle introuvable."
            exit 1
          fi

          echo "Projet Android trouvé : $DIR"
          echo "ANDROID_PROJECT=$DIR" >> "$GITHUB_ENV"

      - name: Construire l'APK
        working-directory: ${{ env.ANDROID_PROJECT }}
        run: gradle assembleDebug --no-daemon

      - name: Récupérer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Movix-Android5-APK
          path: ${{ env.ANDROID_PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
